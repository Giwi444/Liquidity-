name: Build Liquidity Sweep APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q LiquiditySweepDashboard_v1.1_GitHubReady.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/LiquiditySweepDashboard_v1.1_GitHubReady" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquiditySweepDashboard-v1.1
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
